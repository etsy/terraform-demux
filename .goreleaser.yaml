version: 2

builds:
  - main: ./cmd/terraform-demux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

brews:
  - repository:
      owner: etsy
      name: terraform-demux
      # main branch protection requires verified signatures and PR review,
      # so goreleaser cannot push the formula directly. Opening a PR lets
      # GitHub sign the merge commit and satisfies branch protection.
      pull_request:
        enabled: true

    commit_msg_template: "chore: regenerate homebrew formula"

    directory: Formula

    homepage: https://github.com/etsy/terraform-demux
    description: A user-friendly launcher (à la Bazelisk) for Terraform.
    license: "Apache-2.0"

    conflicts:
      - "terraform"

    install: |
      bin.install "terraform-demux"
      bin.install_symlink bin/"terraform-demux" => "terraform"
