version: 2

builds:
  - main: ./cmd/terraform-demux
    env:
      - CGO_ENABLED=0
    # Inject the release tag into main.version so `terraform-demux -version`
    # reports something other than the package default v0.0.1+dev.
    ldflags:
      - -s -w -X main.version=v{{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

brews:
  - repository:
      owner: etsy
      name: terraform-demux
      branch: main
      # Push the formula update over SSH using a deploy key, so the
      # commit is attributed to a Rulesets bypass actor (Deploy keys)
      # and is not blocked by branch protection on main.
      git:
        url: 'git@github.com:etsy/terraform-demux.git'
        private_key: '{{ .Env.RELEASE_DEPLOY_KEY }}'

    commit_msg_template: "chore: regenerate homebrew formula"

    directory: Formula

    homepage: https://github.com/etsy/terraform-demux
    description: A user-friendly launcher (à la Bazelisk) for Terraform.
    license: "Apache-2.0"

    conflicts:
      - "terraform"

    install: |
      bin.install "terraform-demux"
      bin.install_symlink bin/"terraform-demux" => "terraform"
